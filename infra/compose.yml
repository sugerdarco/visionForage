name: visionforge

x-backend-env: &backend-env
  POSTGRES_DB: ${POSTGRES_DB:-visionforge}
  POSTGRES_USER: ${POSTGRES_USER:-visionforge}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env first}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env first}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionforge}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env first}
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:${MINIO_API_PORT:-9000}}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-vf-images}
  S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET:-vf-datasets}
  S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-vf-artifacts}
  S3_PREDICTIONS_BUCKET: ${S3_PREDICTIONS_BUCKET:-vf-predictions}
  DEPLOYMENT_IMAGE: ${DEPLOYMENT_IMAGE:-visionforge-inference:0.1.0}
  DEPLOYMENT_NETWORK: ${DEPLOYMENT_NETWORK:-visionforge_inference}
  DEPLOYMENT_NAMESPACE: ${DEPLOYMENT_NAMESPACE:-visionforge}
  DEPLOYMENT_MAX_ACTIVE: ${DEPLOYMENT_MAX_ACTIVE:-2}
  DEPLOYMENT_CPU_THREADS: ${DEPLOYMENT_CPU_THREADS:-2}
  DEPLOYMENT_MEMORY_MB: ${DEPLOYMENT_MEMORY_MB:-1536}
  DEPLOYMENT_READY_SECONDS: ${DEPLOYMENT_READY_SECONDS:-90}
  DEPLOYMENT_WORK_DIR: /app/serving/deployments
  PREDICTION_LOG_DIR: /app/serving/predictions
  DEPLOYMENT_BUNDLE_VOLUME: visionforge_serving_bundles
  DEPLOYMENT_PREDICTION_VOLUME: visionforge_serving_predictions
  DEPLOYMENT_GATEWAY_URL: ${DEPLOYMENT_GATEWAY_URL:-http://127.0.0.1:8080}
  DEPLOYMENT_GATEWAY_PROBE_URL: http://traefik:8000
  DEPLOYMENT_CORS_ORIGINS: ${DEPLOYMENT_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}

x-backend: &backend
  image: visionforge-backend:0.1.0
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  profiles: [backend]
  init: true
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  group_add: ["${DOCKER_GID:-0}"]
  environment: *backend-env
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=512m]
  mem_limit: 1024m
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "2"}
  volumes:
    - serving_bundles:/app/serving/deployments
    - serving_predictions:/app/serving/predictions
    - /var/run/docker.sock:/var/run/docker.sock:ro
  networks: [default, inference]
  depends_on:
    serving-storage-init: {condition: service_completed_successfully}
    migrate: {condition: service_completed_successfully}
    storage-setup: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  serving-storage-init:
    image: visionforge-backend:0.1.0
    profiles: [backend]
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    environment:
      SERVING_UID: ${LOCAL_UID:-1000}
      SERVING_GID: ${LOCAL_GID:-1000}
    volumes:
      - serving_bundles:/bundles
      - serving_predictions:/predictions
    command:
      - python
      - -c
      - "import os; [(os.chown(p, int(os.environ['SERVING_UID']), int(os.environ['SERVING_GID'])), os.chmod(p, 0o700)) for p in ('/bundles', '/predictions')]"
    restart: "no"

  web:
    image: visionforge-web:0.1.0
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${WEB_API_BASE_URL:-http://127.0.0.1:${API_PORT:-8000}}
    profiles: [backend]
    init: true
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  storage-setup:
    <<: *backend
    command: [python, -m, vf_api.storage]
    depends_on:
      storage-init: {condition: service_completed_successfully}
    restart: "no"
    volumes: []

  migrate:
    <<: *backend
    command: [python, -m, alembic, -c, services/api/alembic.ini, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    volumes: []

  api:
    <<: *backend
    environment:
      <<: *backend-env
      JWT_SECRET: ${JWT_SECRET:?Run make env first}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker-cpu:
    <<: *backend
    command: [python, -m, celery, -A, 'vf_worker.app:app', worker, --queues=cpu, --concurrency=2, --hostname=cpu@%h, --loglevel=WARNING]
    healthcheck:
      test: [CMD-SHELL, 'python -m celery -A vf_worker.app:app inspect ping -d "cpu@$$HOSTNAME" --timeout=5']
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s

  beat:
    <<: *backend
    command: [python, -m, celery, -A, 'vf_worker.app:app', beat, --loglevel=WARNING, --schedule, /tmp/celerybeat-schedule]
    volumes: []

  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    command:
      - --entrypoints.inference.address=:8000
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${DEPLOYMENT_NETWORK:-visionforge_inference}
      - '--providers.docker.constraints=Label(`io.visionforge.gateway`, `${DEPLOYMENT_NETWORK:-visionforge_inference}`)'
      - --api.dashboard=false
      - --serverstransport.forwardingtimeouts.dialtimeout=2s
      - --ping=true
      - --log.level=ERROR
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-8080}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [inference]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16.15-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionforge}
      POSTGRES_USER: ${POSTGRES_USER:-visionforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-bookworm@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make env first}
    command:
      - /bin/sh
      - -ec
      - 'exec docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: visionforge-minio:2025-10-15
    platform: linux/amd64
    build:
      context: ../artifacts/minio
      dockerfile: ../../infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env first}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  storage-init:
    image: visionforge-minio:2025-10-15
    platform: linux/amd64
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-visionforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env first}
      S3_IMAGES_BUCKET: ${S3_IMAGES_BUCKET:-vf-images}
      S3_DATASETS_BUCKET: ${S3_DATASETS_BUCKET:-vf-datasets}
      S3_ARTIFACTS_BUCKET: ${S3_ARTIFACTS_BUCKET:-vf-artifacts}
      S3_PREDICTIONS_BUCKET: ${S3_PREDICTIONS_BUCKET:-vf-predictions}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_IMAGES_BUCKET" "local/$$S3_DATASETS_BUCKET" "local/$$S3_ARTIFACTS_BUCKET" "local/$$S3_PREDICTIONS_BUCKET"

networks:
  inference:
    name: ${DEPLOYMENT_NETWORK:-visionforge_inference}

volumes:
  serving_bundles:
    name: visionforge_serving_bundles
  serving_predictions:
    name: visionforge_serving_predictions
  pg_data:
  redis_data:
  minio_data:
